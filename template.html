<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title><!--title--></title>
<style>
:root {
  --ink: #111;
  --paper: #fff;
  --blue: #0a4aa3;
  --red: #d6001c;
  --yellow: #ffe100;
  --muted: #5a5a5a;
  --hair: #c9c9c9;
  --gothic: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
  --mincho: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--mincho); line-height: 1.75; -webkit-text-size-adjust: 100%; }
a { color: inherit; }
img { display: block; max-width: 100%; }
.sheet { max-width: 46rem; margin: 0 auto; padding: 0 16px 48px; }

.mast { background: var(--blue); color: #fff; border-bottom: 6px solid var(--red); }
.mast-in { max-width: 46rem; margin: 0 auto; padding: 14px 16px 10px; display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 4px 12px; }
.mast-sub { margin: 0; font: 700 0.72rem/1.2 var(--gothic); letter-spacing: 0.12em; }
.mast h1 { margin: 2px 0 0; font: 900 clamp(1.9rem, 9.6vw, 4rem)/1 var(--gothic); letter-spacing: -0.02em; white-space: nowrap; transform: skewX(-9deg); transform-origin: left bottom; text-shadow: 3px 3px 0 var(--ink); }
.mast h1 a { text-decoration: none; }
.mast-date { margin: 0; font: 700 0.8rem/1.3 var(--gothic); text-align: right; white-space: nowrap; }
.score { background: var(--ink); color: #fff; font: 700 0.82rem/1.5 var(--gothic); }
.score-in { max-width: 46rem; margin: 0 auto; padding: 7px 16px; display: flex; flex-wrap: wrap; gap: 2px 20px; }
.score span { display: block; }
.score b { white-space: nowrap; color: var(--yellow); font-size: 1.15em; padding: 0 0.15em; }

.top { padding: 18px 0 6px; }
.top-head { display: flex; flex-direction: row-reverse; gap: 12px; align-items: stretch; }
.top-head h2 { flex: none; margin: 0; writing-mode: vertical-rl; max-height: min(92vw, 25rem); padding: 10px 8px; background: var(--red); color: #fff; font: 900 clamp(1.75rem, 8.4vw, 2.9rem)/1.18 var(--gothic); letter-spacing: 0.02em; text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.55); }
.top-side { flex: 1; min-width: 0; }
.top-side img { width: 100%; height: 100%; min-height: 12rem; max-height: 25rem; object-fit: cover; }
.top-side p { margin: 0; font-size: 1.05rem; font-weight: 700; }
.top .body { margin-top: 12px; }

.sec { margin: 34px 0 0; border-top: 5px solid var(--ink); font: 900 1.05rem/1 var(--gothic); }
.sec span { display: inline-block; background: var(--ink); color: #fff; padding: 7px 14px 8px; letter-spacing: 0.08em; }
.sec.is-rumor { border-color: var(--red); }
.sec.is-rumor span { background: var(--red); }
.sec.is-board { border-color: var(--blue); }
.sec.is-board span { background: var(--blue); }

.item { padding: 16px 0; border-bottom: 1px solid var(--hair); overflow: hidden; }
.item h3 { margin: 0 0 6px; font: 800 1.22rem/1.4 var(--gothic); }
.item .thumb { float: right; width: 34%; max-width: 11rem; margin: 4px 0 6px 12px; }
.body p { margin: 0 0 0.7em; }
.body p:last-child { margin-bottom: 0; }
.kicker { margin: 0 0 4px; font: 700 0.8rem/1.3 var(--gothic); color: var(--blue); }

.src { margin: 8px 0 0; padding: 0; list-style: none; font: 0.8rem/1.6 var(--gothic); color: var(--muted); clear: both; }
.src li { display: inline; }
.src li + li::before { content: " ／ "; }
.src a { text-underline-offset: 2px; }
.src small { font-size: 1em; }

.gauge { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font: 700 0.8rem/1 var(--gothic); }
.meter { display: inline-flex; gap: 3px; }
.meter i { width: 18px; height: 11px; border: 1.5px solid var(--ink); transform: skewX(-18deg); }
.meter i.on { background: var(--red); border-color: var(--red); }
.flag { border: 1.5px solid var(--red); color: var(--red); padding: 3px 6px 2px; }
.origin { margin: 0 0 6px; font: 0.82rem/1.5 var(--gothic); color: var(--muted); }

.media { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--hair); font-family: var(--gothic); }
.media img { width: 38%; max-width: 12rem; flex: none; }
.media a { font-weight: 700; line-height: 1.5; }
.media small { display: block; margin-top: 4px; color: var(--muted); font-size: 0.8rem; }

.closed { margin: 56px 0; text-align: center; }
.closed h2 { margin: 0; font: 900 clamp(3rem, 16vw, 5.5rem)/1.1 var(--gothic); letter-spacing: 0.1em; }
.closed p { margin: 14px 0 0; color: var(--muted); }

.foot { margin-top: 40px; border-top: 5px solid var(--ink); padding-top: 14px; font: 0.82rem/1.7 var(--gothic); color: var(--muted); }
.pager { display: flex; justify-content: space-between; gap: 12px; margin: 0 0 14px; font-weight: 700; color: var(--ink); }
.pager a { padding: 10px 0; }
.foot p { margin: 0 0 6px; }
</style>
</head>
<body>
<!--body-->
</body>
</html>
